openapi: 3.0.3
info:
  title: CrewCentral Device API (002-device-manage)
  version: 0.1.0
  description: |
    命名空间：`{BASE_PATH}/api/v1/devices/*`（客户端 JWT）与 `{BASE_PATH}/api/v1/admin/devices/*`（管理 Session + admin）。
servers:
  - url: https://example.com/woicrew
paths:
  /api/v1/devices/register:
    post:
      tags: [devices-client]
      summary: 静默注册或更新设备基础信息
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_uuid, mac_address, os_version, client_version]
              properties:
                device_uuid:
                  type: string
                name:
                  type: string
                mac_address:
                  type: string
                os_version:
                  type: string
                client_version:
                  type: string
                hardware:
                  type: object
                  description: 最小硬件 JSON（可选）
      responses:
        "200":
          description: rc=0
  /api/v1/devices/heartbeat:
    post:
      tags: [devices-client]
      summary: 心跳保活
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [device_uuid]
              properties:
                device_uuid:
                  type: string
                current_skill_slug:
                  type: string
      responses:
        "200":
          description: ok
        "403":
          description: blocked / kicked
  /api/v1/admin/devices/stats:
    get:
      tags: [devices-admin]
      summary: 统计卡片数据（总数/在线/离线/异常）
      security:
        - sessionAuth: []
      responses:
        "200":
          description: rc=0 data counters
  /api/v1/admin/devices:
    get:
      tags: [devices-admin]
      summary: 分页筛选设备列表
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: string
        - name: ip
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      security:
        - sessionAuth: []
      responses:
        "200":
          description: list + total
  /api/v1/admin/devices/{device_id}/kick:
    post:
      tags: [devices-admin]
      summary: 强制下线（断开连接）
      security:
        - sessionAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /api/v1/admin/devices/{device_id}/block:
    post:
      tags: [devices-admin]
      summary: 加入黑名单
      security:
        - sessionAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /api/v1/admin/devices/{device_id}/reboot:
    post:
      tags: [devices-admin]
      summary: 下发远程重启指令（异步）
      security:
        - sessionAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /api/v1/admin/devices/{device_id}/logs:
    get:
      tags: [devices-admin]
      summary: 最近设备相关日志片段（非 APM）
      security:
        - sessionAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionAuth:
      type: apiKey
      in: cookie
      name: session
