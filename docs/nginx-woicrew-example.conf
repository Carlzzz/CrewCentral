# Example: reverse proxy CrewCentral behind HTTPS with Base Path /woicrew
# Adjust server_name, ssl_certificate paths, and upstream port.

upstream crewcentral_api {
    server 127.0.0.1:8000;
}

server {
    listen 443 ssl;
    server_name crewcentral.example.com;

    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;

    location /woicrew/ {
        proxy_pass http://crewcentral_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
